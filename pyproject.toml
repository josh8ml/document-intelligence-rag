[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "document-intelligence-rag"
dynamic = ["version"]
description = "Production-quality document question-answering platform built with Retrieval-Augmented Generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joshua Lu", email = "joshuamlu2002@gmail.com" }]
keywords = ["rag", "retrieval-augmented-generation", "fastapi", "nlp", "vector-search"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.16",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "httpx2",
]

[project.urls]
Repository = "https://github.com/josh8ml/document-intelligence-rag"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"



# ------------------------------------------------------------------------------
# Ruff: linter+formatter (replaces Black, Flake8, isort)
# ------------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
# Explicit, curated rule set. 'select' replaces Ruff's defaults, so what yousee here is exactly what's enforced.
select=[
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes (undefined names, unused imports)
    "I", # isort (import ordering)
    "B", # flake8-bugbear
    "UP", # pyupgrade (modernize syntax)
    "C4", # flake8-comprehensions
    "SIM", # flake8-simplify
    "N", # pep8-naming
]

[tool.ruff.format]
quote-style="double"
indent-style="space"



# ----------------------------------------------------------------------------
# mypy: static type checking
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["app", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true



# Tests may use untyped helpers/fixtures without failing the type check.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["pymupdf"]
ignore_missing_imports = true